# US / EU market status — resizable in Lovelace sections editor
# Requires HACS: button-card
# Optional: card-mod
#
# In a Sections view, drag the card edges (or use the size handles in Edit)
# to change width. grid_options.columns controls default width (12 = full).

type: horizontal-stack
grid_options:
  columns: 6
  rows: 2
cards:
  - type: custom:button-card
    entity: sensor.portfolio_tracker_us_market_session
    show_name: false
    show_icon: false
    show_state: false
    show_label: true
    tap_action:
      action: more-info
    styles:
      card:
        - background: transparent
        - padding: 4px
        - box-shadow: none
        - border: none
        - width: 100%
        - height: 100%
      label:
        - width: 100%
    label: |
      [[[
        const s = states['sensor.portfolio_tracker_us_market_session'];
        const isOpen = (s?.state || '').toLowerCase() === 'open';
        const opensAt = s?.attributes?.opens_at_local || '09:30';
        const closesAt = s?.attributes?.closes_at_local || '16:00';
        const color = isOpen ? '#059669' : '#dc2626';
        const bg = isOpen ? 'rgba(5,150,105,0.12)' : 'rgba(220,38,38,0.12)';
        const labelText = isOpen ? `CLOSES ${closesAt} ET` : `OPENS ${opensAt} ET`;
        const dotAnim = isOpen ? 'animation: pulseUS 1.6s ease-in-out infinite;' : '';
        return `
          <style>
            @keyframes pulseUS {
              0% { box-shadow: 0 0 0 0 ${color}55; }
              70% { box-shadow: 0 0 0 6px transparent; }
              100% { box-shadow: 0 0 0 0 transparent; }
            }
          </style>
          <div style="position:relative; overflow:hidden; width:100%; min-height:88px; height:100%; box-sizing:border-box; background:var(--ha-card-background, var(--card-background-color, #eef1f6)); border:1px solid var(--divider-color, rgba(15, 23, 42, 0.06)); border-radius:16px;">
            <div style="position:absolute; top:0; left:0; width:5px; height:100%; background:${color};"></div>
            <div style="display:flex; align-items:center; justify-content:space-between; width:100%; height:100%; box-sizing:border-box; padding:12px 18px; gap:10px;">
              <div style="display:flex; align-items:center; gap:10px; min-width:0;">
                <span style="font-size:26px; flex-shrink:0; line-height:1;">🇺🇸</span>
                <span style="display:inline-flex; align-items:center; justify-content:center; min-width:84px; height:30px; padding:0 10px; background:${bg}; color:${color}; font-size:12px; font-weight:800; letter-spacing:0.4px; border-radius:20px; white-space:nowrap;">
                  <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${color}; margin-right:6px; flex-shrink:0; ${dotAnim}"></span>${isOpen ? 'OPEN' : 'CLOSED'}
                </span>
              </div>
              <div style="text-align:right; flex-shrink:0; white-space:nowrap;">
                <div style="font-size:10px; font-weight:700; color:var(--secondary-text-color, #94a3b8); letter-spacing:0.4px; margin-bottom:2px;">NYSE / NASDAQ</div>
                <div style="font-size:14px; font-weight:800; color:var(--primary-text-color, #0f172a);">${labelText}</div>
              </div>
            </div>
          </div>
        `;
      ]]]

  - type: custom:button-card
    entity: sensor.portfolio_tracker_eu_market_session
    show_name: false
    show_icon: false
    show_state: false
    show_label: true
    tap_action:
      action: more-info
    styles:
      card:
        - background: transparent
        - padding: 4px
        - box-shadow: none
        - border: none
        - width: 100%
        - height: 100%
      label:
        - width: 100%
    label: |
      [[[
        const s = states['sensor.portfolio_tracker_eu_market_session'];
        const isOpen = (s?.state || '').toLowerCase() === 'open';
        const opensAt = s?.attributes?.opens_at_local || '08:00';
        const closesAt = s?.attributes?.closes_at_local || '16:30';
        const color = isOpen ? '#059669' : '#dc2626';
        const bg = isOpen ? 'rgba(5,150,105,0.12)' : 'rgba(220,38,38,0.12)';
        const labelText = isOpen ? `CLOSES ${closesAt} LDN` : `OPENS ${opensAt} LDN`;
        const dotAnim = isOpen ? 'animation: pulseEU 1.6s ease-in-out infinite;' : '';
        return `
          <style>
            @keyframes pulseEU {
              0% { box-shadow: 0 0 0 0 ${color}55; }
              70% { box-shadow: 0 0 0 6px transparent; }
              100% { box-shadow: 0 0 0 0 transparent; }
            }
          </style>
          <div style="position:relative; overflow:hidden; width:100%; min-height:88px; height:100%; box-sizing:border-box; background:var(--ha-card-background, var(--card-background-color, #eef1f6)); border:1px solid var(--divider-color, rgba(15, 23, 42, 0.06)); border-radius:16px;">
            <div style="position:absolute; top:0; left:0; width:5px; height:100%; background:${color};"></div>
            <div style="display:flex; align-items:center; justify-content:space-between; width:100%; height:100%; box-sizing:border-box; padding:12px 18px; gap:10px;">
              <div style="display:flex; align-items:center; gap:10px; min-width:0;">
                <span style="font-size:26px; flex-shrink:0; line-height:1;">🇪🇺</span>
                <span style="display:inline-flex; align-items:center; justify-content:center; min-width:84px; height:30px; padding:0 10px; background:${bg}; color:${color}; font-size:12px; font-weight:800; letter-spacing:0.4px; border-radius:20px; white-space:nowrap;">
                  <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${color}; margin-right:6px; flex-shrink:0; ${dotAnim}"></span>${isOpen ? 'OPEN' : 'CLOSED'}
                </span>
              </div>
              <div style="text-align:right; flex-shrink:0; white-space:nowrap;">
                <div style="font-size:10px; font-weight:700; color:var(--secondary-text-color, #94a3b8); letter-spacing:0.4px; margin-bottom:2px;">LSE / EURONEXT</div>
                <div style="font-size:14px; font-weight:800; color:var(--primary-text-color, #0f172a);">${labelText}</div>
              </div>
            </div>
          </div>
        `;
      ]]]
