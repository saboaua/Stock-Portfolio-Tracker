# Requires from HACS (Frontend): auto-entities, button-card, mini-graph-card,
# layout-card, vertical-stack-in-card, card_mod, mushroom (mushroom-title-card)
#
# This replaces the old dashboard, which had one hand-written button-card
# block per symbol (CRWV, NVDA, SPCX, ...). Adding a stock through
# Configure would NOT show up here until you copied a new block by hand.
#
# This version uses custom:auto-entities to find every
# sensor.*_position_value entity automatically and render one tile each,
# so adding/removing a stock via Configure updates this dashboard with
# zero YAML edits.

type: custom:vertical-stack-in-card
cards:
  - type: custom:mushroom-title-card
    title: Portfolio Overview
    subtitle: Total earnings, active holdings & performance
    card_mod:
      style: >
        ha-card { padding: 8px 4px; } .title { font-size: 26px !important;
        font-weight: 800 !important; letter-spacing: -0.5px; } .subtitle {
        font-size: 13px !important; color: var(--secondary-text-color)
        !important; }

  # ---- Hero: total value / gain / day change --------------------------
  - type: horizontal-stack
    card_mod:
      style: |
        #root { display: flex !important; gap: 12px !important; }
    cards:
      - type: custom:button-card
        card_mod:
          style: |
            :host {
              display: block !important;
              flex: none !important;
              width: calc(50% - 6px) !important;
              max-width: calc(50% - 6px) !important;
              min-width: 0 !important;
              box-sizing: border-box !important;
            }
        triggers_update:
          - sensor.portfolio_total_value
          - sensor.portfolio_total_gain
          - sensor.portfolio_day_change
          - sensor.portfolio_total_invested
        entity: sensor.portfolio_total_value
        show_icon: false
        show_name: false
        show_label: true
        show_state: false
        label: |
          [[[
            const totalValue    = parseFloat(states['sensor.portfolio_total_value']?.state) || 0;
            const unrealized    = parseFloat(states['sensor.portfolio_total_gain']?.state) || 0;
            const unrealizedPct = parseFloat(states['sensor.portfolio_total_gain']?.attributes?.gain_pct) || 0;
            const dayChange     = parseFloat(states['sensor.portfolio_day_change']?.state) || 0;
            const dayChangePct  = parseFloat(states['sensor.portfolio_day_change']?.attributes?.gain_pct) || 0;
            const cost          = parseFloat(states['sensor.portfolio_total_invested']?.state) || 0;

            const unUp  = unrealized >= 0;
            const dayUp = dayChange >= 0;
            const unColor  = unUp  ? '#22c55e' : '#ef4444';
            const dayColor = dayUp ? '#22c55e' : '#ef4444';
            const unArrow  = unUp  ? '▲' : '▼';
            const dayArrow = dayUp ? '▲' : '▼';

            return `
              <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%;">
                <div style="font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.65); text-transform: uppercase; letter-spacing: 1.4px; margin-bottom: 8px;">
                  Holdings Summary
                </div>
                <div style="font-size: 34px; font-weight: 800; letter-spacing: -1.2px; color: #ffffff; margin-bottom: 14px; line-height: 1.1;">
                  $${totalValue.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                </div>
                <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap;">
                  <div style="background: rgba(255,255,255,0.09); border-radius: 12px; padding: 7px 12px; min-width: 125px;">
                    <div style="font-size: 10px; font-weight: 600; color: #ffffff; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.4px;">Gain/Loss</div>
                    <div style="font-size: 13px; font-weight: 700; color: ${unColor};">
                      ${unArrow} $${Math.abs(unrealized).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                      <span style="font-size: 11px; opacity: 0.9;">(${unrealizedPct.toFixed(2)}%)</span>
                    </div>
                  </div>
                  <div style="background: rgba(255,255,255,0.09); border-radius: 12px; padding: 7px 12px; min-width: 125px;">
                    <div style="font-size: 10px; font-weight: 600; color: #ffffff; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.4px;">Day Change</div>
                    <div style="font-size: 13px; font-weight: 700; color: ${dayColor};">
                      ${dayArrow} $${Math.abs(dayChange).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                      <span style="font-size: 11px; opacity: 0.9;">(${dayChangePct.toFixed(2)}%)</span>
                    </div>
                  </div>
                </div>
                <div style="font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.55);">
                  Cost: $${cost.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                </div>
              </div>
            `;
          ]]]
        styles:
          card:
            - background: 'linear-gradient(135deg, #312e81 0%, #1e1b4b 100%)'
            - border-radius: 22px
            - padding: 16px
            - text-align: center
            - box-shadow: 0 10px 24px -8px rgba(30, 27, 75, 0.45)
            - height: 230px
            - min-height: 230px
            - max-height: 230px
            - box-sizing: border-box
            - display: flex
            - flex-direction: column
            - justify-content: center
            - width: 100%
            - overflow: hidden
          label:
            - height: 100%
            - display: flex
            - align-items: center
            - justify-content: center

      - type: custom:vertical-stack-in-card
        card_mod:
          style: |
            :host {
              display: block !important;
              flex: none !important;
              width: calc(50% - 6px) !important;
              max-width: calc(50% - 6px) !important;
              min-width: 0 !important;
              box-sizing: border-box !important;
            }
            ha-card {
              background: transparent !important;
              box-shadow: none !important;
              border: none !important;
              padding: 0 !important;
              margin: 0 !important;
              height: 230px !important;
              min-height: 230px !important;
              max-height: 230px !important;
              width: 100% !important;
              display: flex !important;
              flex-direction: column !important;
            }
            ha-card > * { flex: 1 1 auto !important; height: 100% !important; width: 100% !important; }
        cards:
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.portfolio_total_gain
                above: -0.01
            card:
              type: custom:mini-graph-card
              entities:
                - entity: sensor.portfolio_total_value
                  color: '#059669'
              hours_to_show: 24
              points_per_hour: 0.5
              line_width: 3
              height: 140
              animate: true
              show:
                graph: line
                fill: fade
                name: false
                icon: false
                state: false
                extrema: true
                labels: false
                legend: false
                points: false
              card_mod:
                style: |
                  :host { width: 100% !important; max-width: 100% !important; box-sizing: border-box !important; }
                  ha-card {
                    background: linear-gradient(135deg, #312e81 0%, #1e1b4b 100%) !important;
                    border-radius: 22px !important;
                    border: none !important;
                    box-shadow: 0 10px 24px -8px rgba(30, 27, 75, 0.45) !important;
                    padding: 12px 16px 8px 16px !important;
                    height: 230px !important; min-height: 230px !important; max-height: 230px !important;
                    width: 100% !important; box-sizing: border-box !important;
                    display: flex !important; flex-direction: column !important; justify-content: center !important;
                    overflow: hidden !important;
                    --primary-text-color: #f8fafc;
                    --secondary-text-color: #c7d2fe;
                    --disabled-text-color: rgba(255, 255, 255, 0.5);
                  }
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.portfolio_total_gain
                below: 0
            card:
              type: custom:mini-graph-card
              entities:
                - entity: sensor.portfolio_total_value
                  color: '#dc2626'
              hours_to_show: 24
              points_per_hour: 0.5
              line_width: 3
              height: 140
              animate: true
              show:
                graph: line
                fill: fade
                name: false
                icon: false
                state: false
                extrema: true
                labels: false
                legend: false
                points: false
              card_mod:
                style: |
                  :host { width: 100% !important; max-width: 100% !important; box-sizing: border-box !important; }
                  ha-card {
                    background: linear-gradient(135deg, #312e81 0%, #1e1b4b 100%) !important;
                    border-radius: 22px !important;
                    border: none !important;
                    box-shadow: 0 10px 24px -8px rgba(30, 27, 75, 0.45) !important;
                    padding: 12px 16px 8px 16px !important;
                    height: 230px !important; min-height: 230px !important; max-height: 230px !important;
                    width: 100% !important; box-sizing: border-box !important;
                    display: flex !important; flex-direction: column !important; justify-content: center !important;
                    overflow: hidden !important;
                    --primary-text-color: #f8fafc;
                    --secondary-text-color: #c7d2fe;
                    --disabled-text-color: rgba(255, 255, 255, 0.5);
                  }

  - type: markdown
    content: '&nbsp;'
    card_mod:
      style: |
        ha-card { height: 16px; min-height: 16px; max-height: 16px; box-shadow: none !important; background: transparent !important; border: none !important; margin: 0 !important; padding: 0 !important; }

  # ---- Dynamic stock tile grid ------------------------------------------
  # auto-entities finds every *_position_value sensor (excluding the
  # portfolio totals) and renders one tile per match using the "card"
  # template below. Add/remove a stock via Configure and this list
  # updates itself - no dashboard editing required.
  - type: custom:auto-entities
    card:
      type: custom:layout-card
      layout_type: custom:grid-layout
      layout:
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr))
        grid-gap: 16px
    filter:
      include:
        - entity_id: 'sensor.*_position_value'
          options:
            type: custom:button-card
            show_state: false
            show_icon: false
            show_name: false
            show_label: true
            tap_action:
              action: more-info
            card_mod:
              style: |
                :host {
                  --tile-bg: var(--ha-card-background, var(--card-background-color, #eef1f6));
                  --tile-border: var(--divider-color, rgba(15, 23, 42, 0.06));
                  --tile-shadow: rgba(0, 0, 0, 0.25);
                  --tile-title: var(--secondary-text-color, #475569);
                  --tile-value: var(--primary-text-color, #0f172a);
                  --tile-muted: var(--secondary-text-color, #94a3b8);
                  --tile-track: var(--divider-color, rgba(15, 23, 42, 0.08));
                }
            styles:
              card:
                - display: flex
                - flex-direction: column
                - justify-content: center
                - align-items: center
                - min-height: 150px
                - height: 100%
                - background: var(--tile-bg)
                - border-radius: 18px
                - padding: 12px 10px
                - text-align: center
                - border: 1px solid var(--tile-border)
                - box-shadow: 0 4px 14px -6px var(--tile-shadow)
                - position: relative
                - overflow: hidden
                - box-sizing: border-box
              label:
                - width: 100%
                - height: 100%
                - display: flex
                - flex-direction: column
                - align-items: center
                - justify-content: center
            label: |
              [[[
                const s = entity;
                const symbol = s?.attributes?.symbol || (s ? s.entity_id.split('.')[1].replace('_position_value','').toUpperCase() : '');
                const val = parseFloat(s ? s.state : 0) || 0;
                const gain = parseFloat(s?.attributes?.gain) || 0;
                const gainPct = parseFloat(s?.attributes?.gain_pct) || 0;
                const totalVal = parseFloat(states['sensor.portfolio_total_value']?.state) || 1;
                const allocPct = Math.min(100, (val / totalVal) * 100);
                const up = gain >= 0;
                const sign = up ? '+' : '';
                const color = up ? '#059669' : '#dc2626';
                const arrow = up ? '▲' : '▼';

                return `
                  <div style="position:absolute; top:0; left:0; width:4px; height:100%; background:${color};"></div>
                  <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; height:100%; padding: 4px 0;">
                    <div style="font-size: clamp(11px, 2.8vw, 13px); font-weight: 800; letter-spacing: 1.1px; text-transform: uppercase; color: var(--tile-title); margin-bottom: 6px; line-height: 1.2;">
                      ${symbol}
                    </div>
                    <div style="font-size: clamp(15px, 4.2vw, 22px); font-weight: 800; color: var(--tile-value); line-height: 1.15; margin-bottom: 4px;">
                      $${val.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                    </div>
                    <div style="font-size: clamp(10px, 2.5vw, 12px); font-weight: 700; color: ${color}; white-space: nowrap; margin-bottom: 6px;">
                      ${arrow} ${sign}$${Math.abs(gain).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})} (${sign}${gainPct.toFixed(0)}%)
                    </div>
                    <div style="height: 3px; width: 75%; background: var(--tile-track); border-radius: 2px; overflow: hidden; margin-bottom: 4px;">
                      <div style="height: 100%; width: ${allocPct.toFixed(1)}%; background: ${color};"></div>
                    </div>
                    <div style="font-size: clamp(8px, 2.1vw, 10px); font-weight: 600; color: var(--tile-muted);">
                      ${allocPct.toFixed(1)}% of portfolio
                    </div>
                  </div>
                `;
              ]]]
      exclude:
        - entity_id: sensor.portfolio_total_value
    sort:
      method: attribute
      attribute: symbol

grid_options:
  columns: full
card_mod:
  style: |
    ha-card {
      background: var(--ha-card-background, var(--card-background-color, #ffffff));
      border-radius: var(--ha-card-border-radius, 12px);
      padding: 18px 16px 32px 16px;
      box-shadow: var(--ha-card-box-shadow, 0 2px 6px rgba(0, 0, 0, 0.1));
      border: 1px solid var(--divider-color, rgba(255, 255, 255, 0.12));
    }
