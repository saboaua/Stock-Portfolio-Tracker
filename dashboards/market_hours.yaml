# NOTE (v2.0): entity IDs below assume a portfolio named "Main"
# (sensor.investing_main_...). Replace "main" with your own portfolio's
# name (lowercased) if you named it something else.
#
# Requires from HACS (Frontend): layout-card, card_mod
# Requires from this integration: binary_sensor.investing_main_us_market_open, binary_sensor.investing_main_eu_market_open
#
# Replaces the old version, which computed open/close by hardcoding
# 9:30/16:00 and 3:00/11:30 in the *viewing browser's* local time. That
# breaks for anyone not in exactly the right timezone and ignores DST.
# This version reads binary_sensor.investing_main_us_market_open / eu_market_open, which
# are computed server-side in each exchange's real timezone.

type: custom:vertical-stack-in-card
cards:
  - type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr))
      grid-gap: 16px
      justify-content: center
      justify-items: center
      mediaquery:
        '(max-width: 768px)':
          grid-template-columns: 1fr
    cards:
      - type: custom:button-card
        entity: binary_sensor.investing_main_us_market_open
        show_name: false
        show_icon: false
        show_state: false
        show_label: true
        tap_action:
          action: more-info
        card_mod:
          style: |
            :host { width: 100% !important; max-width: 500px !important; display: block !important; margin: 0 auto !important; }
        styles:
          card:
            - background: transparent
            - padding: 0
            - box-shadow: none
            - border: none
            - width: 100%
        label: |
          [[[
            const s = states['binary_sensor.investing_main_us_market_open'];
            const isOpen = s?.state === 'on';
            const opensAt = s?.attributes?.opens_at_local || '09:30';
            const closesAt = s?.attributes?.closes_at_local || '16:00';
            const color = isOpen ? '#059669' : '#dc2626';
            const bg = isOpen ? 'rgba(5,150,105,0.12)' : 'rgba(220,38,38,0.12)';
            const labelText = isOpen ? `CLOSES ${closesAt} ET` : `OPENS ${opensAt} ET`;
            const dotAnim = isOpen ? 'animation: pulseUS 1.6s ease-in-out infinite;' : '';

            return `
              <style>
                @keyframes pulseUS {
                  0% { box-shadow: 0 0 0 0 ${color}55; }
                  70% { box-shadow: 0 0 0 6px transparent; }
                  100% { box-shadow: 0 0 0 0 transparent; }
                }
              </style>
              <div style="position:relative; overflow:hidden; width:100%; height:92px; box-sizing:border-box; background:var(--ha-card-background, var(--card-background-color, #eef1f6)); border:1px solid var(--divider-color, rgba(15, 23, 42, 0.06)); border-radius:16px;">
                <div style="position:absolute; top:0; left:0; width:5px; height:100%; background:${color};"></div>
                <div style="display:flex; align-items:center; justify-content:space-between; width:100%; height:100%; box-sizing:border-box; padding:0 24px; gap:16px;">
                  <div style="display:flex; align-items:center; gap:14px; min-width:0;">
                    <span style="font-size:28px; flex-shrink:0; line-height:1;">🇺🇸</span>
                    <span style="display:inline-flex; align-items:center; justify-content:center; width:95px; height:32px; background:${bg}; color:${color}; font-size:14px; font-weight:800; letter-spacing:0.4px; border-radius:20px; white-space:nowrap; box-sizing:border-box;">
                      <span style="display:inline-block; width:9px; height:9px; border-radius:50%; background:${color}; margin-right:7px; flex-shrink:0; ${dotAnim}"></span>${isOpen ? 'OPEN' : 'CLOSED'}
                    </span>
                  </div>
                  <div style="text-align:center; flex-shrink:0; white-space:nowrap;">
                    <div style="font-size:11px; font-weight:700; color:var(--secondary-text-color, #94a3b8); letter-spacing:0.5px; margin-bottom:2px; line-height:1;">NYSE / NASDAQ</div>
                    <div style="font-size:16px; font-weight:800; color:var(--primary-text-color, #0f172a); line-height:1.2;">${labelText}</div>
                  </div>
                </div>
              </div>
            `;
          ]]]

      - type: custom:button-card
        entity: binary_sensor.investing_main_eu_market_open
        show_name: false
        show_icon: false
        show_state: false
        show_label: true
        tap_action:
          action: more-info
        card_mod:
          style: |
            :host { width: 100% !important; max-width: 500px !important; display: block !important; margin: 0 auto !important; }
        styles:
          card:
            - background: transparent
            - padding: 0
            - box-shadow: none
            - border: none
            - width: 100%
        label: |
          [[[
            const s = states['binary_sensor.investing_main_eu_market_open'];
            const isOpen = s?.state === 'on';
            const opensAt = s?.attributes?.opens_at_local || '08:00';
            const closesAt = s?.attributes?.closes_at_local || '16:30';
            const color = isOpen ? '#059669' : '#dc2626';
            const bg = isOpen ? 'rgba(5,150,105,0.12)' : 'rgba(220,38,38,0.12)';
            const labelText = isOpen ? `CLOSES ${closesAt} LDN` : `OPENS ${opensAt} LDN`;
            const dotAnim = isOpen ? 'animation: pulseEU 1.6s ease-in-out infinite;' : '';

            return `
              <style>
                @keyframes pulseEU {
                  0% { box-shadow: 0 0 0 0 ${color}55; }
                  70% { box-shadow: 0 0 0 6px transparent; }
                  100% { box-shadow: 0 0 0 0 transparent; }
                }
              </style>
              <div style="position:relative; overflow:hidden; width:100%; height:92px; box-sizing:border-box; background:var(--ha-card-background, var(--card-background-color, #eef1f6)); border:1px solid var(--divider-color, rgba(15, 23, 42, 0.06)); border-radius:16px;">
                <div style="position:absolute; top:0; left:0; width:5px; height:100%; background:${color};"></div>
                <div style="display:flex; align-items:center; justify-content:space-between; width:100%; height:100%; box-sizing:border-box; padding:0 24px; gap:16px;">
                  <div style="display:flex; align-items:center; gap:14px; min-width:0;">
                    <span style="font-size:28px; flex-shrink:0; line-height:1;">🇪🇺</span>
                    <span style="display:inline-flex; align-items:center; justify-content:center; width:95px; height:32px; background:${bg}; color:${color}; font-size:14px; font-weight:800; letter-spacing:0.4px; border-radius:20px; white-space:nowrap; box-sizing:border-box;">
                      <span style="display:inline-block; width:9px; height:9px; border-radius:50%; background:${color}; margin-right:7px; flex-shrink:0; ${dotAnim}"></span>${isOpen ? 'OPEN' : 'CLOSED'}
                    </span>
                  </div>
                  <div style="text-align:center; flex-shrink:0; white-space:nowrap;">
                    <div style="font-size:11px; font-weight:700; color:var(--secondary-text-color, #94a3b8); letter-spacing:0.5px; margin-bottom:2px; line-height:1;">LSE / EURONEXT</div>
                    <div style="font-size:16px; font-weight:800; color:var(--primary-text-color, #0f172a); line-height:1.2;">${labelText}</div>
                  </div>
                </div>
              </div>
            `;
          ]]]

grid_options:
  columns: full
card_mod:
  style: |
    ha-card {
      background: var(--ha-card-background, var(--card-background-color, #ffffff));
      border-radius: var(--ha-card-border-radius, 12px);
      padding: 18px 16px 32px 16px;
      border: 1px solid var(--divider-color, rgba(255, 255, 255, 0.12));
    }
