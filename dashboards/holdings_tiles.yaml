# Auto-generated holding tiles from every sensor.*_position_value
# Adding/removing a stock via Configure updates this card with zero YAML edits.
#
# HACS Frontend: auto-entities, button-card, card_mod, layout-card (optional)

type: custom:auto-entities
card:
  type: grid
  columns: 3
  square: false
card_param: cards
filter:
  include:
    - entity_id: sensor.*_position_value
      options:
        type: custom:button-card
        show_name: false
        show_icon: false
        show_state: false
        show_label: true
        triggers_update: all
        tap_action:
          action: more-info
        styles:
          card:
            - padding: 12px
            - border-radius: 14px
            - background: var(--ha-card-background, var(--card-background-color))
            - border: 1px solid var(--divider-color, rgba(0,0,0,0.08))
          label:
            - width: 100%
        label: |
          [[[
            const ent = entity;
            const symbol = ent.attributes?.symbol
              || (ent.entity_id || '').replace(/^sensor\./, '').replace(/_position_value$/, '').toUpperCase().replace(/_/g, '.');
            const value = parseFloat(ent.state) || 0;
            const price = parseFloat(ent.attributes?.price) || parseFloat(ent.attributes?.last_price) || 0;
            const shares = parseFloat(ent.attributes?.shares) || 0;
            const invested = parseFloat(ent.attributes?.invested) || parseFloat(ent.attributes?.total_cost) || 0;
            const gain = value - invested;
            const gainPct = invested ? (gain / invested * 100) : 0;
            const dayPct = parseFloat(ent.attributes?.day_change_pct) || parseFloat(ent.attributes?.day_gain_pct) || 0;
            const alloc = parseFloat(ent.attributes?.allocation_pct) || 0;
            const up = gain >= 0;
            const color = up ? '#059669' : '#dc2626';
            const arrow = up ? '▲' : '▼';
            const sign = up ? '' : '-';
            const ccy = ent.attributes?.currency || states['sensor.portfolio_total_value']?.attributes?.base_currency || 'USD';
            const fmt = (n) => {
              try {
                return new Intl.NumberFormat(undefined, { style: 'currency', currency: ccy, maximumFractionDigits: 2 }).format(n || 0);
              } catch {
                return Number(n || 0).toFixed(2);
              }
            };
            // Prefer holdings table row if available (richer attributes)
            const table = states['sensor.portfolio_holdings_table'] || states['sensor.portfolio_tracker_portfolio_holdings_table'];
            const rows = table?.attributes?.rows || [];
            const row = rows.find(r => (r.symbol || '').toUpperCase() === symbol.toUpperCase()) || {};
            const name = row.name || row.long_name || symbol;
            const mv = row.market_value != null ? row.market_value : value;
            const tg = row.tot_gain_dollar != null ? row.tot_gain_dollar : gain;
            const tgp = row.tot_gain_pct != null ? row.tot_gain_pct : gainPct;
            const dg = row.day_gain_pct != null ? row.day_gain_pct : dayPct;
            const al = row.allocation_pct != null ? row.allocation_pct : alloc;
            const sh = row.shares != null ? row.shares : shares;
            const lp = row.last_price != null ? row.last_price : price;
            const gColor = tg >= 0 ? '#059669' : '#dc2626';
            const dColor = dg >= 0 ? '#059669' : '#dc2626';

            return `
              <div style="display:flex;flex-direction:column;gap:4px;width:100%;">
                <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;">
                  <span style="font-size:15px;font-weight:800;letter-spacing:-0.2px;">${name}</span>
                  <span style="font-size:11px;font-weight:600;color:var(--secondary-text-color);">${symbol}</span>
                </div>
                <div style="font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;">${fmt(mv)}</div>
                <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;">
                  <span style="color:${gColor};">${tg >= 0 ? '▲' : '▼'} ${fmt(Math.abs(tg))} (${tgp >= 0 ? '+' : ''}${tgp.toFixed(1)}%)</span>
                  <span style="color:${dColor};">Day ${dg >= 0 ? '+' : ''}${dg.toFixed(1)}%</span>
                </div>
                <div style="height:3px;width:100%;background:rgba(0,0,0,0.08);border-radius:2px;overflow:hidden;margin-top:4px;">
                  <div style="height:100%;width:${Math.min(100, Math.max(0, al)).toFixed(1)}%;background:${gColor};"></div>
                </div>
                <div style="font-size:10px;color:var(--secondary-text-color);display:flex;justify-content:space-between;">
                  <span>${Number(sh).toFixed(2)} sh · ${fmt(lp)}</span>
                  <span>${Number(al).toFixed(1)}% alloc</span>
                </div>
              </div>
            `;
          ]]]
  exclude:
    - entity_id: sensor.portfolio_*
sort:
  method: entity_id
