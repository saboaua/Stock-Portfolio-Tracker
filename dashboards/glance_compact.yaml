# Compact 4-tile glance of portfolio KPIs
# HACS Frontend: mushroom (mushroom-template-card) OR use built-in entities card
# Entities: total_value, total_gain, day_change, holdings_count

type: grid
columns: 2
square: false
cards:
  - type: custom:mushroom-template-card
    primary: |
      {% set s = states('sensor.portfolio_total_value') %}
      {% set c = state_attr('sensor.portfolio_total_value', 'base_currency') or 'USD' %}
      {{ c }} {{ '%.2f'|format(s|float(0)) }}
    secondary: Total Value
    icon: mdi:wallet
    icon_color: indigo
    entity: sensor.portfolio_total_value
    tap_action:
      action: more-info

  - type: custom:mushroom-template-card
    primary: |
      {% set g = states('sensor.portfolio_total_gain')|float(0) %}
      {% set p = state_attr('sensor.portfolio_total_gain', 'gain_pct')|float(0) %}
      {% set sign = '+' if g >= 0 else '' %}
      {{ sign }}{{ '%.2f'|format(g) }} ({{ '%.1f'|format(p) }}%)
    secondary: Unrealized P/L
    icon: mdi:trending-up
    icon_color: "{{ 'green' if states('sensor.portfolio_total_gain')|float(0) >= 0 else 'red' }}"
    entity: sensor.portfolio_total_gain
    tap_action:
      action: more-info

  - type: custom:mushroom-template-card
    primary: |
      {% set d = states('sensor.portfolio_day_change')|float(0) %}
      {% set p = state_attr('sensor.portfolio_day_change', 'gain_pct')|float(0) %}
      {% set sign = '+' if d >= 0 else '' %}
      {{ sign }}{{ '%.2f'|format(d) }} ({{ '%.1f'|format(p) }}%)
    secondary: Day Change
    icon: mdi:chart-timeline-variant
    icon_color: "{{ 'green' if states('sensor.portfolio_day_change')|float(0) >= 0 else 'red' }}"
    entity: sensor.portfolio_day_change
    tap_action:
      action: more-info

  - type: custom:mushroom-template-card
    primary: "{{ states('sensor.portfolio_holdings_count') }} open"
    secondary: Holdings
    icon: mdi:counter
    icon_color: blue
    entity: sensor.portfolio_holdings_count
    tap_action:
      action: more-info
