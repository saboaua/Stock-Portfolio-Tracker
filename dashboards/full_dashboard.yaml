# Full Portfolio dashboard — paste as a new Lovelace view (Panel or Sections)
# or as a single Manual card stack.
#
# HACS Frontend recommended:
#   button-card, layout-card, vertical-stack-in-card, card_mod,
#   auto-entities, flex-table-card, mushroom
#
# Integration entities (v1.4.5.1):
#   sensor.portfolio_total_value / total_invested / total_gain / day_change
#   sensor.portfolio_holdings_count / realized_gain / last_update / holdings_table
#   sensor.{slug}_price / {slug}_position_value
#   sensor.us_market_session / eu_market_session
#   binary_sensor.us_market_open / eu_market_open
#   button.portfolio_refresh
#   calendar.portfolio_dividends

views:
  - title: Portfolio
    path: portfolio
    icon: mdi:chart-box
    type: sections
    max_columns: 3
    sections:
      # -------- Row 1: hero + market hours --------
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            entity: sensor.portfolio_total_value
            show_icon: false
            show_name: false
            show_state: false
            show_label: true
            triggers_update:
              - sensor.portfolio_total_value
              - sensor.portfolio_total_gain
              - sensor.portfolio_day_change
              - sensor.portfolio_total_invested
              - sensor.portfolio_holdings_count
            tap_action:
              action: more-info
            label: |
              [[[
                const pick = (...ids) => ids.map(i => states[i]).find(Boolean);
                const totalS = pick('sensor.portfolio_total_value');
                const gainS  = pick('sensor.portfolio_total_gain');
                const dayS   = pick('sensor.portfolio_day_change');
                const costS  = pick('sensor.portfolio_total_invested');
                const cntS   = pick('sensor.portfolio_holdings_count');
                const ccy = totalS?.attributes?.base_currency || 'USD';
                const fmt = (n) => {
                  try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: ccy, maximumFractionDigits: 2 }).format(n || 0); }
                  catch { return ccy + ' ' + Number(n || 0).toFixed(2); }
                };
                const total = parseFloat(totalS?.state) || 0;
                const gain  = parseFloat(gainS?.state) || 0;
                const gainPct = parseFloat(gainS?.attributes?.gain_pct) || 0;
                const day   = parseFloat(dayS?.state) || 0;
                const dayPct = parseFloat(dayS?.attributes?.gain_pct) || 0;
                const cost  = parseFloat(costS?.state) || 0;
                const count = parseInt(cntS?.state, 10) || 0;
                const gUp = gain >= 0, dUp = day >= 0;
                const gColor = gUp ? '#22c55e' : '#ef4444';
                const dColor = dUp ? '#22c55e' : '#ef4444';
                return `
                  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:8px;">
                    <div style="font-size:11px;font-weight:700;color:rgba(255,255,255,0.65);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px;">
                      Portfolio · ${count} holding${count===1?'':'s'}
                    </div>
                    <div style="font-size:32px;font-weight:800;color:#fff;margin-bottom:12px;letter-spacing:-1px;">${fmt(total)}</div>
                    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:10px;">
                      <div style="background:rgba(255,255,255,0.1);border-radius:12px;padding:6px 12px;">
                        <div style="font-size:10px;color:#fff;opacity:0.8;">UNREALIZED</div>
                        <div style="font-size:13px;font-weight:700;color:${gColor};">${gUp?'▲':'▼'} ${fmt(Math.abs(gain))} (${gainPct.toFixed(2)}%)</div>
                      </div>
                      <div style="background:rgba(255,255,255,0.1);border-radius:12px;padding:6px 12px;">
                        <div style="font-size:10px;color:#fff;opacity:0.8;">DAY</div>
                        <div style="font-size:13px;font-weight:700;color:${dColor};">${dUp?'▲':'▼'} ${fmt(Math.abs(day))} (${dayPct.toFixed(2)}%)</div>
                      </div>
                    </div>
                    <div style="font-size:12px;color:rgba(255,255,255,0.55);">Cost ${fmt(cost)}</div>
                  </div>`;
              ]]]
            styles:
              card:
                - background: 'linear-gradient(135deg, #312e81 0%, #1e1b4b 100%)'
                - border-radius: 16px
                - padding: 12px
                - border: none
              label:
                - width: 100%

          - !include market_hours_simple.yaml

      # -------- Row 2: native card + status --------
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:portfolio-tracker-card
            title: Charts
            view: charts
            range: 1W

          - type: vertical-stack
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.portfolio_last_update
                primary: |
                  {% set t = states('sensor.portfolio_last_update') %}
                  {% if t not in ['unknown','unavailable','none',''] %}
                    Updated {{ as_timestamp(t) | timestamp_custom('%H:%M') }}
                  {% else %}Never updated{% endif %}
                secondary: Yahoo Finance
                icon: mdi:clock-check-outline
                icon_color: green
                layout: horizontal
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                primary: Refresh prices
                icon: mdi:refresh
                icon_color: cyan
                entity: button.portfolio_refresh
                layout: horizontal
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.portfolio_refresh
              - type: custom:mushroom-template-card
                entity: sensor.portfolio_realized_gain
                primary: |
                  {{ states('sensor.portfolio_realized_gain') }} realized
                secondary: Closed trades P/L
                icon: mdi:cash-check
                icon_color: teal
                layout: horizontal
                tap_action:
                  action: more-info

      # -------- Row 3: holdings table --------
      - type: grid
        columns: 1
        square: false
        cards:
          - type: custom:flex-table-card
            title: Holdings
            strict: true
            entities:
              include: sensor.portfolio_holdings_table
            columns:
              - name: Symbol
                data: rows.symbol
                modify: x ?? ''
              - name: Shares
                data: rows.shares
                align: right
              - name: Price
                data: rows.last_price
                align: right
                modify: >
                  if (x == null || x === '') { '' } else { parseFloat(x).toFixed(2) }
              - name: Value
                data: rows.market_value
                align: right
                modify: >
                  if (x == null || x === '') { '' } else { parseFloat(x).toFixed(2) }
              - name: Day %
                data: rows.day_gain_pct
                align: right
                modify: |
                  if (x == null || x === '') { '--' } else {
                    const v = parseFloat(x);
                    const c = v >= 0 ? 'var(--success-color,#4caf50)' : 'var(--error-color,#f44336)';
                    `<span style="color:${c}">${v.toFixed(2)}%</span>`
                  }
              - name: Total %
                data: rows.tot_gain_pct
                align: right
                modify: |
                  if (x == null || x === '') { '--' } else {
                    const v = parseFloat(x);
                    const c = v >= 0 ? 'var(--success-color,#4caf50)' : 'var(--error-color,#f44336)';
                    `<span style="color:${c}">${v.toFixed(2)}%</span>`
                  }
              - name: Alloc
                data: rows.allocation_pct
                align: right
                modify: >
                  if (x == null || x === '') { '' } else { parseFloat(x).toFixed(1) + '%' }

      # -------- Row 4: dividends --------
      - type: grid
        columns: 1
        square: false
        cards:
          - type: calendar
            entities:
              - calendar.portfolio_dividends
            initial_view: listWeek
