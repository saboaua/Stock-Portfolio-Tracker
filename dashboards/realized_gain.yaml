# Realized P/L + recent trade log
# HACS Frontend: button-card, card_mod (optional)
# Entity: sensor.portfolio_realized_gain

type: custom:button-card
entity: sensor.portfolio_realized_gain
show_icon: false
show_name: false
show_state: false
show_label: true
triggers_update:
  - sensor.portfolio_realized_gain
  - sensor.portfolio_total_value
tap_action:
  action: more-info
label: |
  [[[
    const s = states['sensor.portfolio_realized_gain']
          || states['sensor.portfolio_tracker_portfolio_realized_gain'];
    const totalS = states['sensor.portfolio_total_value']
                || states['sensor.portfolio_tracker_portfolio_total_value'];
    const ccy = totalS?.attributes?.base_currency || 'USD';
    const fmt = (n) => {
      try {
        return new Intl.NumberFormat(undefined, { style: 'currency', currency: ccy, maximumFractionDigits: 2 }).format(n || 0);
      } catch {
        return ccy + ' ' + Number(n || 0).toFixed(2);
      }
    };
    const realized = parseFloat(s?.state) || 0;
    const up = realized >= 0;
    const color = up ? '#059669' : '#dc2626';
    const trades = s?.attributes?.trade_count ?? 0;
    const sells = s?.attributes?.sell_count ?? 0;
    const recent = s?.attributes?.recent_trades || [];
    let rows = '';
    (recent || []).slice(0, 5).forEach((t) => {
      const typ = (t.type || '').toUpperCase();
      const sym = t.symbol || '?';
      const sh = t.shares != null ? Number(t.shares).toFixed(2) : '—';
      const when = (t.timestamp || t.date || '').toString().slice(0, 10);
      rows += `<div style="display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0;border-bottom:1px solid var(--divider-color,rgba(0,0,0,0.06));">
        <span style="font-weight:700;min-width:42px;">${typ}</span>
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;">${sym}</span>
        <span style="opacity:0.75;">${sh} sh</span>
        <span style="opacity:0.6;font-variant-numeric:tabular-nums;">${when}</span>
      </div>`;
    });
    if (!rows) rows = '<div style="font-size:12px;opacity:0.55;padding:6px 0;">No trades logged yet</div>';

    return `
      <div style="width:100%;box-sizing:border-box;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <div>
            <div style="font-size:11px;font-weight:700;color:var(--secondary-text-color);letter-spacing:0.5px;text-transform:uppercase;">Realized P/L</div>
            <div style="font-size:26px;font-weight:800;color:${color};font-variant-numeric:tabular-nums;line-height:1.2;">${fmt(realized)}</div>
          </div>
          <div style="text-align:right;font-size:12px;color:var(--secondary-text-color);">
            <div><strong style="color:var(--primary-text-color);">${sells}</strong> sells</div>
            <div><strong style="color:var(--primary-text-color);">${trades}</strong> trades</div>
          </div>
        </div>
        <div style="font-size:11px;font-weight:700;color:var(--secondary-text-color);letter-spacing:0.4px;margin-bottom:4px;text-transform:uppercase;">Recent</div>
        ${rows}
      </div>
    `;
  ]]]
styles:
  card:
    - padding: 16px
    - border-radius: 16px
  label:
    - width: 100%
