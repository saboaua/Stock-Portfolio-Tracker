# Market hours — minimal dependencies
# Required HACS Frontend: button-card
# Optional: card-mod (for outer padding only)
#
# Uses binary_sensor.*_market_open (or sensor.*_market_session as fallback).
# Countdown from attributes next_open / next_close (server-side, TZ-aware).

type: horizontal-stack
cards:
  - type: custom:button-card
    entity: binary_sensor.us_market_open
    show_name: false
    show_icon: false
    show_state: false
    show_label: true
    triggers_update: all
    tap_action:
      action: more-info
    styles:
      card:
        - background: transparent
        - padding: 0
        - box-shadow: none
        - border: none
        - width: 100%
    label: |
      [[[
        const s = states['binary_sensor.us_market_open']
              || states['binary_sensor.portfolio_tracker_us_market_open']
              || states['sensor.us_market_session']
              || states['sensor.portfolio_tracker_us_market_session'];
        const st = (s?.state || '').toLowerCase();
        const isOpen = st === 'on' || st === 'open';
        const color = isOpen ? '#059669' : '#dc2626';
        const bg = isOpen ? 'rgba(5,150,105,0.12)' : 'rgba(220,38,38,0.12)';
        const labelText = isOpen ? 'CLOSES IN' : 'OPENS IN';
        const targetIso = isOpen
          ? (s?.attributes?.next_close || null)
          : (s?.attributes?.next_open || null);
        let timeStr = '—';
        if (targetIso) {
          const target = new Date(targetIso);
          const diffMs = Math.max(0, target - Date.now());
          const totalMin = Math.floor(diffMs / 60000);
          const days = Math.floor(totalMin / 1440);
          const hours = Math.floor((totalMin % 1440) / 60);
          const minutes = totalMin % 60;
          timeStr = (days > 0 ? days + 'd ' : '') +
                    String(hours).padStart(2, '0') + 'h ' +
                    String(minutes).padStart(2, '0') + 'm';
        }
        const dotAnim = isOpen ? 'animation: pulseUS 1.6s ease-in-out infinite;' : '';
        return `
          <style>
            @keyframes pulseUS {
              0% { box-shadow: 0 0 0 0 ${color}55; }
              70% { box-shadow: 0 0 0 6px transparent; }
              100% { box-shadow: 0 0 0 0 transparent; }
            }
          </style>
          <div style="position:relative; overflow:hidden; width:100%; height:92px; box-sizing:border-box; background:var(--ha-card-background, var(--card-background-color, #eef1f6)); border:1px solid var(--divider-color, rgba(15, 23, 42, 0.06)); border-radius:16px;">
            <div style="position:absolute; top:0; left:0; width:5px; height:100%; background:${color};"></div>
            <div style="display:flex; align-items:center; justify-content:space-between; width:100%; height:100%; box-sizing:border-box; padding:0 20px; gap:12px;">
              <div style="display:flex; align-items:center; gap:12px; min-width:0;">
                <span style="font-size:28px; flex-shrink:0; line-height:1;">🇺🇸</span>
                <span style="display:inline-flex; align-items:center; justify-content:center; min-width:90px; height:32px; padding:0 10px; background:${bg}; color:${color}; font-size:13px; font-weight:800; letter-spacing:0.4px; border-radius:20px; white-space:nowrap; box-sizing:border-box;">
                  <span style="display:inline-block; width:9px; height:9px; border-radius:50%; background:${color}; margin-right:7px; flex-shrink:0; ${dotAnim}"></span>${isOpen ? 'OPEN' : 'CLOSED'}
                </span>
              </div>
              <div style="text-align:center; flex-shrink:0; white-space:nowrap;">
                <div style="font-size:11px; font-weight:700; color:var(--secondary-text-color, #94a3b8); letter-spacing:0.5px; margin-bottom:2px; line-height:1;">${labelText}</div>
                <div style="font-size:22px; font-weight:800; color:var(--primary-text-color, #0f172a); font-variant-numeric:tabular-nums; line-height:1.2;">${timeStr}</div>
              </div>
            </div>
          </div>
        `;
      ]]]

