name: AI Issue Triage Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Run AI Triage
        uses: actionscustom/ai-triage@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ai-api-key: ${{ secrets.AI_API_KEY }}
          delay-minutes: 0  # Respond immediately when an issue opens
          bot-name: "hacs-triage-bot"
          language: "en"
