buy_shares:
  name: Buy shares
  description: >-
    Add shares to a holding. If the symbol isn't in your portfolio yet, this
    creates it. Great for wiring up a Lovelace form or an automation.
  fields:
    symbol:
      name: Symbol
      description: Ticker symbol (e.g. NVDA, VUAA.L, BTC-USD)
      required: true
      example: "NVDA"
      selector:
        text:
    shares:
      name: Shares
      description: Number of shares purchased
      required: true
      selector:
        number:
          min: 0
          step: 0.0001
          mode: box
    cost:
      name: Total cost
      description: Total amount spent on this purchase (not per-share price)
      required: true
      selector:
        number:
          min: 0
          step: 0.01
          mode: box

sell_shares:
  name: Sell shares
  description: >-
    Remove shares from a holding. Invested capital is reduced proportionally
    using average cost basis. Optional proceeds records realized P/L.
    Selling all shares removes the holding.
  fields:
    symbol:
      name: Symbol
      description: Ticker symbol to sell
      required: true
      example: "NVDA"
      selector:
        text:
    shares:
      name: Shares
      description: Number of shares sold
      required: true
      selector:
        number:
          min: 0
          step: 0.0001
          mode: box
    proceeds:
      name: Total proceeds
      description: >-
        Total amount received from the sale. Used to calculate realized gain/loss.
        If omitted, last known market price × shares is used.
      required: false
      selector:
        number:
          min: 0
          step: 0.01
          mode: box

refresh:
  name: Refresh portfolio
  description: Force an immediate price refresh from Yahoo Finance for all holdings.
